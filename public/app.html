<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpotiRun App</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Generate Playlist</h1>
        <p>Create a private run playlist from your Spotify top tracks.</p>

        <form id="playlistForm">
          <label for="pace">Pace (min/km, optional unless distance is set)</label>
          <input id="pace" name="pace" placeholder="5:30 or 5.5" />

          <div class="row">
            <div>
              <label for="durationMin">Duration (minutes, optional)</label>
              <input id="durationMin" name="durationMin" type="number" min="1" step="1" placeholder="45" />
            </div>
            <div>
              <label for="distanceKm">Distance (km, optional; preferred if both set)</label>
              <input id="distanceKm" name="distanceKm" type="number" min="0" step="0.1" placeholder="10" />
            </div>
          </div>
          <p class="meta">Use duration or distance. If both are set, distance is used.</p>

          <label class="inline" for="explicitOk">
            <input id="explicitOk" name="explicitOk" type="checkbox" />
            Allow explicit tracks
          </label>

          <button type="submit" id="submitBtn">Generate Playlist</button>
          <button type="button" class="secondary" id="logoutBtn">Disconnect</button>
          <div id="error" class="error" role="alert"></div>
        </form>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
